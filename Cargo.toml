[package]
name = "kazumidiplayer"
version = "0.1.0"
edition = "2024"

[dependencies]
libloading = "0.9.0"
# SUPPORT_SCREEN_CAPTURE is deliberately absent: it compiles a hardcoded
# F12-takes-a-screenshot handler into raylib, with no way to turn it off at runtime.
# The rest is only what this app actually draws with. Audio is KDMAPI's job, and
# nothing here loads a model, a font file or an image file.
raylib = { version = "6.0.0", default-features = false, features = [
    "GLFW_BUILD_X11",
    "SUPPORT_MODULE_RSHAPES",
    "SUPPORT_MODULE_RTEXTURES",
    "SUPPORT_MODULE_RTEXT",
    "SUPPORT_MODULE_RMODELS",
    "SUPPORT_MODULE_RAUDIO",
    "USE_AUDIO",
    "SUPPORT_IMAGE_GENERATION",
    "SUPPORT_WINMM_HIGHRES_TIMER",
    "SUPPORT_TRACELOG",
] }

kazumidiparser = { version = "0.1.0", path = "vendor/kazumidiparser-rs" }
rustc-hash = "2"
rfd = "0.17.2"
cpal = "0.18.2"
csynth = { git = "https://git.c30.life/ced/csynth-v2", version = "0.1.0" }
rayon = "1.12.0"
rusty-opus = "1.2.0"

# Only referenced from debug builds (the ViSQOL graph window scores
# the prerender Opus round trip). Release builds compile them but never
# link them; the cfg dependency table cannot express that (Cargo does
# not support cfg(debug_assertions) there).
audio_samples_qoe = "0.1.3"
audio_samples = "2.0.1"
ndarray = "0.17.2"

# The ViSQOL crates are used only from cfg(debug_assertions) code, so
# the release profile would warn about them as unused dependencies forever.
[lints.cargo]
unused_dependencies = "allow"

# Rust's debug binaries use the release MSVC runtime. Compile native build scripts
# without debug assertions so raylib's CMake build selects the matching runtime.
[profile.dev.build-override]
debug-assertions = false

# ViSQOL is far too slow to score with in an unoptimized build, so the
# dev profile optimizes audio_samples_qoe and its heavy DSP dependencies.
[profile.dev.package.audio_samples_qoe]
opt-level = 3

[profile.dev.package.audio_samples]
opt-level = 3

[profile.dev.package.spectrograms]
opt-level = 3

[profile.dev.package.ndarray]
opt-level = 3
